<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#161616" />
    <title>Brak połączenia · Gąska Intranet</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
            background: #161616; color: #E8E8E6; text-align: center;
            font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .card { max-width: 360px; }
        .mark { width: 72px; height: 72px; border-radius: 18px; background: #fff; display: inline-flex; align-items: center; justify-content: center; }
        .mark img { width: 54px; height: 54px; }
        h1 { font-size: 1.4rem; margin: 20px 0 8px; }
        p { color: #A5A5A3; line-height: 1.5; margin: 0 0 24px; }
        a { display: inline-block; padding: 12px 24px; border-radius: 10px; background: #F9C211; color: #1F1F1F; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark"><img src="/img/mark.png" alt="" /></div>
        <h1>Brak połączenia</h1>
        <p>Intranet działa tylko z dostępem do sieci. Sprawdź internet lub Wi-Fi i spróbuj ponownie.</p>
        <a href="/">Spróbuj ponownie</a>
    </div>
</body>
</html>
